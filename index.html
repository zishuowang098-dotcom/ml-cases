/* 全站统一的视觉润色层：在各案例原有样式之上加载 */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif;line-height:1.6}
::selection{background:#f0ae3c55}

/* 顶部导航：胶囊式标签，当前页高亮 */
.topbar{box-shadow:0 1px 0 #ffffff80,0 6px 24px -18px #17223559}
.topnav{gap:6px;background:#efebe2;border:1px solid var(--line,#dcd8ce);border-radius:999px;padding:4px}
.topnav a{border-radius:999px;padding:7px 16px;font-size:15px;line-height:1.2;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.topnav a:hover{background:#fffdfa;color:var(--ink,#172235);font-weight:600}
.topnav a.active{background:var(--ink,#172235);color:#fff;font-weight:700;box-shadow:0 4px 12px -6px #172235aa}
.brand-mark{box-shadow:0 6px 16px -8px #172235cc}
.case-switch{transition:color .2s}
.case-switch:hover{color:var(--ink,#172235)}

/* 交互反馈：按钮、开关、表格行 */
button{transition:background-color .18s,border-color .18s,color .18s,box-shadow .18s,transform .18s}
button:not(:disabled):active{transform:translateY(1px)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f0ae3c;outline-offset:2px;border-radius:6px}
input[type=range]{cursor:pointer;height:22px}
table tbody tr{transition:background-color .15s}
pre,code{font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
pre{tab-size:4}

/* 散点图里的点：悬停放大，便于点击 */
[class*="_point_"],.sample-point{transition:transform .18s,box-shadow .18s}
[class*="_point_"]:hover,.sample-point:hover{transform:translate(-50%,50%) scale(1.35)}
.sample-point:hover{transform:scale(1.35)}

/* 页脚 */
footer{border-top:1px solid var(--line,#dcd8ce)}
footer a{font-weight:600}
footer a:hover{color:var(--ink,#172235)}

/* 手机：导航不再隐藏，改为可横向滑动的标签条 */
@media (max-width:860px){
  .topbar{grid-template-columns:1fr auto;row-gap:10px}
  .topnav{display:flex!important;grid-column:1/-1;grid-row:2;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  .topnav::-webkit-scrollbar{display:none}
  .topnav a{padding:6px 13px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.topbar,.topnav,.case-switch{position:static;box-shadow:none}}

/* 坐标刻度 */
.axis-tick{position:absolute;z-index:2;color:#8a8f98;font-size:11.5px;line-height:1;font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap}
.axis-tick.tick-x{bottom:-8px;transform:translate(-50%,100%)}
.axis-tick.tick-y{left:-8px;transform:translate(-100%,50%)}
.x-label,[class*="_xLabel_"]{bottom:-40px!important;font-weight:600}
.y-label{left:-62px!important;font-weight:600}
[class*="_yLabel_"]{top:-26px!important;font-weight:600}
.plot,[class*="_plot_"]{margin-bottom:58px!important;margin-left:58px!important}
.plot{margin-left:76px!important}
.y-label{left:-92px!important}
._yLabel_qj7cg_89{top:50%!important;left:-104px!important}
._plot_qj7cg_89,[class*="_plot_qj7cg"]{margin-left:80px!important}
/* 回归 / SVM 的预测区：按实际滑块数量自适应排布 */
[class*="_predictor_"]{display:flex!important;flex-wrap:wrap;align-items:flex-end;gap:16px 22px!important}
[class*="_predictor_"]>div:first-child{flex:0 0 auto;min-width:150px}
[class*="_predictor_"]>label{flex:1 1 170px;min-width:150px}
[class*="_predictor_"]>[class*="_prediction_"],[class*="_predictor_"]>[class*="_guess_"]{flex:0 0 auto}
